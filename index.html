<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data: https://*.supabase.co">
<title>고객 상담 노트</title>
<!-- 아이폰 "홈 화면에 추가"용 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="상담 노트">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141b" media="(prefers-color-scheme: dark)">
<style>
/* Standalone file: no network needed. Data is kept in this browser (localStorage); backup/export buttons move it elsewhere.
   Layout: sticky header over either a ledger ("전체 고객") or a month calendar with the selected day's rows ("날짜별 연락").
   Under 900px rows become cards and calendar cells show counts. */
:root {
  --bg: #f2f5f9;
  --surface: #ffffff;
  --surface-2: #f7f9fc;
  --line: #dde3ec;
  --fg: #18202c;
  --muted: #5b6779;
  --accent: #2748b5;
  --accent-fg: #ffffff;
  --ring: rgba(39, 72, 181, 0.28);
  --danger: #b3261e;
  --st-none-bg: #e9edf3;
  --st-none-fg: #465366;
  --st-done-bg: #d9f1e2;
  --st-done-fg: #155a35;
  --st-miss-bg: #fbe5cf;
  --st-miss-fg: #84450a;
  --font-body: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', system-ui, sans-serif;
  --font-num: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --cols: minmax(100px, 1fr) minmax(140px, 1.1fr) 120px minmax(200px, 3fr) 150px 58px;
  --cols-c: minmax(100px, 1fr) minmax(140px, 1.1fr) minmax(180px, 2.4fr) minmax(150px, 1.2fr) 58px;
  --cols-d: 150px 120px minmax(200px, 1fr) 58px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10141b;
    --surface: #171d27;
    --surface-2: #1d2430;
    --line: #2a3342;
    --fg: #e7ecf4;
    --muted: #9aa6ba;
    --accent: #8aa4ff;
    --accent-fg: #0e1424;
    --ring: rgba(138, 164, 255, 0.35);
    --danger: #ff8a80;
    --st-none-bg: #263040;
    --st-none-fg: #b2bdcf;
    --st-done-bg: #17382a;
    --st-done-fg: #86d9a9;
    --st-miss-bg: #3d2b14;
    --st-miss-fg: #f0b878;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  padding-block: 0 calc(48px + env(safe-area-inset-bottom, 0px));
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 30;
}
[hidden] { display: none !important; }
.wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--bg);
  padding-block: 14px 6px;
}
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; }
.save.err, .bk-info.warn { color: var(--danger); }
.link { padding: 2px 0; border: 0; background: transparent; color: var(--accent); font-size: 13px; text-decoration: underline; text-underline-offset: 2px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 380px; justify-content: flex-end; min-width: 0; }
#q {
  flex: 1 1 150px;
  min-width: 0;
  max-width: 260px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
}
#q:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
.seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.seg button { display: inline-flex; align-items: center; padding: 7px 12px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.badge { margin-left: 6px; padding: 0 7px; border-radius: 999px; background: var(--danger); color: var(--surface); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.btn {
  flex: none;
  padding: 9px 14px;
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: var(--accent-fg);
  font-weight: 600;
  white-space: nowrap;
}
.heads {
  display: grid;
  grid-template-columns: var(--cols);
  gap: 8px;
  margin-top: 10px;
  padding: 6px 13px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}
.heads span { padding-left: 9px; }
.heads.hc { grid-template-columns: var(--cols-c); }
.heads2, .heads3 { margin-top: 0; }
.heads3 { grid-template-columns: var(--cols-d); }

/* customer rows (고객 정보 목록) */
.row.crow { grid-template-columns: var(--cols-c); }
.sum-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); text-align: left; font-size: 13px; }
.sum-btn:hover { border-color: var(--accent); }
.sum-1 { font-weight: 600; }
.sum-1.late { color: var(--danger); }
.sum-1.today { color: var(--accent); }
.sum-1.none { color: var(--muted); font-weight: 400; }
.sum-2 { color: var(--muted); font-size: 12px; }
.sum-3 { color: var(--accent); font-size: 12px; font-weight: 600; }
/* visit rows (날짜별) */
.who { display: flex; align-items: center; gap: 4px; width: 100%; min-width: 0; padding: 6px 8px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--fg); font-weight: 600; text-align: left; }
.who:hover { border-color: var(--line); }
.who-n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who-a { flex: none; color: var(--accent); }
.ph { min-width: 0; padding: 6px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* customer page (고객 정보 상세) */
.detail { margin-top: 8px; }
.dt-top { margin-bottom: 10px; }
.dt-card { display: grid; grid-template-columns: minmax(140px, 1fr) minmax(180px, 1.2fr); gap: 10px 16px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.dt-l.wide { grid-column: 1 / -1; }
.cap2 { display: block; margin: 0 0 3px 2px; color: var(--muted); font-size: 12px; }
.dt-card .f { border-color: var(--line); background: var(--surface-2); }
.dt-card .nm { font-size: 17px; }
.dt-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 18px 0 8px; }
.dt-h { margin: 0; font-size: 16px; font-weight: 600; }
.dt-h .gc { margin-left: 6px; color: var(--muted); font-size: 13px; font-weight: 400; }
#dtList .row { grid-template-columns: var(--cols-d); grid-template-areas: "next call note act"; }
#dtList .c.name, #dtList .c.phone { display: none; }
#dtList .c.next { grid-area: next; }
#dtList .c.call { grid-area: call; }
#dtList .c.note { grid-area: note; }
#dtList .c.act { grid-area: act; }
.dt-empty { margin: 0; padding: 16px 4px; color: var(--muted); }
.dt-foot { display: flex; justify-content: flex-end; margin-top: 18px; }

/* 상담 추가 창 */
.dlg { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 24px) 16px 16px; background: rgba(10, 14, 22, 0.45); overflow: auto; }
.dlg-box { width: 100%; max-width: 440px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25); }
.dlg-box h2 { margin: 0 0 12px; font-size: 17px; font-weight: 600; }
.dlg .f { font-size: 16px; padding: 9px 10px; border-color: var(--line); background: var(--surface-2); }
.pk-lab { display: block; margin: 0 0 4px 2px; color: var(--muted); font-size: 13px; }
.pk-list { display: flex; flex-direction: column; gap: 4px; max-height: min(42vh, 320px); overflow: auto; margin: 8px 0 12px; }
.pk-it { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-align: left; }
.pk-it:hover, .pk-it.hi { border-color: var(--accent); background: var(--surface-2); }
.pk-it b { font-size: 15px; font-weight: 600; }
.pk-it .num { color: var(--muted); }
.pk-m { flex-basis: 100%; min-width: 0; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pk-hint { padding: 6px 2px; color: var(--muted); font-size: 13px; }
.pk-new { padding-top: 12px; border-top: 1px solid var(--line); }
.dlg-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.btn:disabled { opacity: 0.5; cursor: default; }

/* 하루 끝 알림 */
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin: 8px 0 4px; padding: 10px 12px; border: 1px solid var(--accent); border-radius: 12px; background: var(--surface); }
.bn-t { font-weight: 600; }
.bn-b { display: flex; gap: 8px; }

/* 일자별 리포트 */
.report { margin-top: 8px; }
.rp-tools { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.rp { padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.rp h2 { margin: 0; font-size: 20px; font-weight: 600; }
.rp-made { margin: 2px 0 14px; color: var(--muted); font-size: 12px; }
.rp h3 { margin: 20px 0 8px; font-size: 15px; font-weight: 600; }
.rp h3 .gc { margin-left: 6px; color: var(--muted); font-size: 13px; font-weight: 400; }
.rp-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.rp-st { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.rp-st b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.rp-st span { color: var(--muted); font-size: 12px; }
.rp-st.done b { color: var(--st-done-fg); }
.rp-st.miss b { color: var(--st-miss-fg); }
.rp-t { width: 100%; border-collapse: collapse; font-size: 13px; }
.rp-t th { padding: 6px 8px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 600; text-align: left; white-space: nowrap; }
.rp-t td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.rp-t td.nm2 { font-weight: 600; white-space: nowrap; }
.rp-t td.ph2 { font-family: var(--font-num); white-space: nowrap; }
.rp-t td.nt { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 12em; }
.rp-t td.nx { white-space: nowrap; }
.rs { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--st-bg); color: var(--st-fg); font-size: 12px; font-weight: 600; white-space: nowrap; }
.rs.s-none { --st-bg: var(--st-none-bg); --st-fg: var(--st-none-fg); }
.rs.s-done { --st-bg: var(--st-done-bg); --st-fg: var(--st-done-fg); }
.rs.s-miss { --st-bg: var(--st-miss-bg); --st-fg: var(--st-miss-fg); }
.rp-ul { margin: 0; padding-left: 20px; }
.rp-ul li { margin: 3px 0; }
.rp-ul .num { color: var(--muted); }
.rp-note { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
@media screen and (max-width: 640px) {
  .rp { padding: 14px; }
  .rp-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rp-t thead { display: none; }
  .rp-t tr { display: block; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .rp-t td { display: block; padding: 2px 0; border: 0; }
  .rp-t td[data-cap]::before { content: attr(data-cap) " · "; color: var(--muted); font-size: 12px; }
  .rp-t td.nt { min-width: 0; }
}
@media print {
  :root {
    --bg: #fff; --surface: #fff; --surface-2: #f3f4f6; --line: #c4c8cf; --fg: #000; --muted: #4a4f57;
    --st-none-bg: #e9edf3; --st-none-fg: #465366; --st-done-bg: #d9f1e2; --st-done-fg: #155a35; --st-miss-bg: #fbe5cf; --st-miss-fg: #84450a;
    color-scheme: light;
  }
  html, body { background: #fff; }
  body { padding: 0; }
  body::before, header.top, #banner, #cal, #heads2, #list, #state, #detail, .rp-tools, .dlg, [role="dialog"] { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .rp { padding: 0; border: 0; }
  .rp-t tr, .rp-st { break-inside: avoid; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* calendar */
.cal { margin-top: 8px; margin-bottom: 14px; }
.cal-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.cal-title { min-width: 7.5em; text-align: center; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.nav { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 18px; line-height: 1; }
.mini-btn { padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.late-btn { margin-left: auto; border-color: var(--danger); color: var(--danger); font-weight: 600; }
.late-btn[aria-pressed="true"] { background: var(--danger); color: var(--surface); }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.wd { padding: 6px 0; text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.wd:first-child { color: var(--danger); }
.day {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 3px;
  min-width: 0;
  min-height: 98px;
  padding: 5px 6px 6px;
  border: 0;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg);
  text-align: left;
}
.day:nth-child(7n) { border-right: 0; }
.day:hover { background: var(--surface-2); }
.day.out { background: var(--surface-2); color: var(--muted); }
.day.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.dn { align-self: flex-start; display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 4px; border-radius: 999px; font-size: 13px; font-variant-numeric: tabular-nums; }
.day.sun .dn { color: var(--danger); }
.day.today .dn { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.day.late .dn { color: var(--danger); font-weight: 600; }
.names { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pn {
  display: block;
  padding: 1px 6px;
  border-radius: 5px;
  background: var(--st-bg);
  color: var(--st-fg);
  font-size: 12px;
  line-height: 1.5;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pn.s-none { --st-bg: var(--st-none-bg); --st-fg: var(--st-none-fg); }
.pn.s-done { --st-bg: var(--st-done-bg); --st-fg: var(--st-done-fg); text-decoration: line-through; }
.pn.s-miss { --st-bg: var(--st-miss-bg); --st-fg: var(--st-miss-fg); }
.more { padding-left: 6px; color: var(--muted); font-size: 11px; }
.cnt { display: none; }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.list:empty { display: none; }
h2.grp {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 0;
  padding: 10px 13px 8px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  font-size: 14px;
  font-weight: 600;
}
h2.grp .gc { color: var(--muted); font-size: 13px; font-weight: 400; }
h2.grp.late { color: var(--danger); }
h2.grp.today { color: var(--accent); }
.row {
  display: grid;
  grid-template-columns: var(--cols);
  gap: 8px;
  align-items: start;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
}
.list > .row:last-child { border-bottom: 0; }
.row.dim { opacity: 0.6; }
.row.dim:focus-within { opacity: 1; }
.c { min-width: 0; }
.cap { display: none; }
.f {
  display: block;
  width: 100%;
  padding: 6px 8px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  line-height: 1.45;
}
.f:hover { border-color: var(--line); }
.f:focus { outline: none; border-color: var(--accent); background: var(--surface-2); box-shadow: 0 0 0 3px var(--ring); }
.f::placeholder { color: var(--muted); opacity: 0.7; }
textarea.f { resize: none; overflow: hidden; min-height: 34px; }
.nm { font-weight: 600; }
.num, input[type="date"].f { font-family: var(--font-num); font-size: 13px; }
.phone-in { display: flex; align-items: center; gap: 4px; }
.tel {
  flex: none;
  padding: 3px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--accent);
  font-size: 12px;
  text-decoration: none;
}
.pill { position: relative; display: inline-block; }
.pill::after { content: "▾"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--st-fg); font-size: 11px; pointer-events: none; }
.pill select {
  appearance: none;
  -webkit-appearance: none;
  padding: 6px 28px 6px 12px;
  border: 0;
  border-radius: 999px;
  background: var(--st-bg);
  color: var(--st-fg);
  font-weight: 600;
}
.row { --st-bg: var(--st-none-bg); --st-fg: var(--st-none-fg); }
.row[data-status="done"] { --st-bg: var(--st-done-bg); --st-fg: var(--st-done-fg); }
.row[data-status="miss"] { --st-bg: var(--st-miss-bg); --st-fg: var(--st-miss-fg); }
.called { display: block; margin: 3px 0 0 4px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.act { display: flex; justify-content: flex-end; }
.del { padding: 6px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 12px; white-space: nowrap; }
.del:hover { color: var(--danger); }
.del[data-arm="1"] { background: var(--danger); color: var(--surface); font-weight: 600; }

.state { margin-top: 20px; padding: 36px 20px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; color: var(--muted); }
.state h2 { margin: 0 0 6px; font-size: 16px; font-weight: 600; color: var(--fg); }
.state p { margin: 0 auto 16px; max-width: 42ch; }

@media (max-width: 899px) {
  .heads { display: none; }
  .tools { flex-basis: 100%; justify-content: flex-start; }
  #q { flex: 1 1 100%; max-width: none; }
  .day { min-height: 54px; align-items: center; gap: 2px; padding: 4px 1px; }
  .dn { align-self: center; }
  .names { display: none; }
  .cnt {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    height: 20px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--st-none-bg);
    color: var(--st-none-fg);
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .cnt.late { background: var(--danger); color: var(--surface); }
  .cnt.today { background: var(--accent); color: var(--accent-fg); }
  .cnt.alldone { background: var(--st-done-bg); color: var(--st-done-fg); }
  .list { display: grid; gap: 10px; background: transparent; border: 0; border-radius: 0; overflow: visible; }
  h2.grp { padding: 8px 2px 0; background: transparent; border: 0; }
  .row {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "name call" "phone phone" "note note" "next act";
    gap: 10px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
  }
  .list > .row:last-child { border-bottom: 1px solid var(--line); }
  .c.name { grid-area: name; }
  .c.phone { grid-area: phone; }
  .c.call { grid-area: call; justify-self: end; text-align: right; }
  .c.note { grid-area: note; }
  .c.next { grid-area: next; }
  .c.act { grid-area: act; align-items: end; }
  .cap { display: block; margin: 0 0 2px 2px; color: var(--muted); font-size: 12px; }
  .c.name .cap, .c.call .cap { display: none; }
  .f { font-size: 16px; border-color: var(--line); background: var(--surface-2); padding: 8px 10px; }
  .num, input[type="date"].f { font-size: 15px; }
  .nm { font-size: 17px; }
  .pill select { font-size: 15px; padding: 8px 30px 8px 14px; }
  .called { margin-right: 4px; }
  .tel { padding: 7px 10px; font-size: 13px; }
  .del { padding: 8px 10px; font-size: 13px; }
  .row.crow { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name act" "phone phone" "memo memo" "sum sum"; }
  .c.memo { grid-area: memo; }
  .c.sum { grid-area: sum; }
  .c.sum .cap { display: none; }
  .sum-btn { padding: 9px 12px; font-size: 14px; }
  .who { padding: 2px 0; font-size: 17px; }
  .ph { padding: 4px 0; font-size: 15px; }
  .dt-card { grid-template-columns: minmax(0, 1fr); }
  .dt-card .f { font-size: 16px; padding: 8px 10px; }
  #dtList .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "next call" "note note" ". act"; }
  #dtList .c.next .cap { display: block; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div>
        <h1>고객 상담 노트</h1>
        <p class="sub">
          <span id="summary">불러오는 중…</span>
          <span id="save" class="save" role="status" aria-live="polite"></span>
        </p>
        <p class="sub">
          <button id="bkExport" class="link" type="button">백업 저장</button>
          <button id="bkImport" class="link" type="button">백업 불러오기</button>
          <button id="csv" class="link" type="button">엑셀로 저장</button>
          <span id="bkInfo" class="bk-info"></span>
        </p>
        <input id="file" type="file" accept=".json,application/json" hidden>
      </div>
      <div class="tools">
        <input id="q" type="search" placeholder="이름·번호·메모·상담내용 검색" autocomplete="off" aria-label="고객 검색">
        <div class="seg" role="group" aria-label="보기 전환">
          <button id="vAll" type="button" aria-pressed="true">고객 정보</button>
          <button id="vDate" type="button" aria-pressed="false">날짜별 연락<span id="badge" class="badge" hidden></span></button>
        </div>
        <button id="add" class="btn" type="button">+ 고객 추가</button>
      </div>
    </div>
    <div id="headsTop" class="heads hc" aria-hidden="true">
      <span>이름</span><span>연락처</span><span>메모</span><span>상담</span><span></span>
    </div>
  </div>
</header>

<main id="main" class="wrap">
  <div id="banner" class="banner" role="status" hidden>
    <span id="bnText" class="bn-t"></span>
    <span class="bn-b"><button id="bnOpen" class="btn" type="button">리포트 보기</button><button id="bnClose" class="mini-btn" type="button">닫기</button></span>
  </div>
  <section id="report" class="report" aria-label="상담 리포트" hidden>
    <div class="rp-tools"><button id="rpBack" class="mini-btn" type="button">‹ 돌아가기</button><button id="rpPrint" class="btn" type="button">인쇄 / PDF 저장</button></div>
    <div id="rpBody" class="rp"></div>
  </section>
  <section id="cal" class="cal" aria-label="연락 일정 달력" hidden></section>
  <div id="heads2" class="heads heads2" aria-hidden="true" hidden>
    <span>이름</span><span>연락처</span><span>통화</span><span>상담내용</span><span>상담일</span><span></span>
  </div>
  <div id="list" class="list"></div>
  <div id="state" class="state" hidden></div>

  <section id="detail" class="detail" aria-label="고객 정보" hidden>
    <div class="dt-top"><button id="dtBack" class="mini-btn" type="button">‹ 고객 목록</button></div>
    <div id="dtCard" class="dt-card">
      <div class="dt-l"><span class="cap2">이름</span><input id="dtName" class="f nm" data-f="name" placeholder="이름" autocomplete="off" aria-label="이름"></div>
      <div class="dt-l"><span class="cap2">연락처</span><div class="phone-in"><input id="dtPhone" class="f num" data-f="phone" type="text" inputmode="tel" placeholder="010-0000-0000" autocomplete="off" aria-label="연락처"><a class="tel" href="#" hidden>전화</a></div></div>
      <div class="dt-l wide"><span class="cap2">메모</span><textarea id="dtMemo" class="f" data-f="memo" rows="2" placeholder="주소, 특이사항 등 고객에 대해 기억할 내용" aria-label="고객 메모"></textarea></div>
    </div>
    <div class="dt-bar">
      <h2 class="dt-h">상담 이력<span id="dtCount" class="gc"></span></h2>
      <button id="dtAdd" class="btn" type="button">+ 상담 추가</button>
    </div>
    <div class="heads heads3" aria-hidden="true"><span>상담일</span><span>통화</span><span>상담내용</span><span></span></div>
    <div id="dtList" class="list"></div>
    <p id="dtEmpty" class="dt-empty" hidden>아직 상담 기록이 없습니다. "+ 상담 추가"를 누르거나, 날짜별 연락 달력에서 날짜를 고른 뒤 이 고객을 추가하세요.</p>
    <div class="dt-foot"><button id="dtDel" class="del" type="button">이 고객 삭제</button></div>
  </section>
</main>

<div id="pick" class="dlg" hidden>
  <div class="dlg-box" role="dialog" aria-modal="true" aria-labelledby="pkTitle">
    <h2 id="pkTitle">상담 추가</h2>
    <label class="pk-lab" for="pkName">기존 고객을 찾거나, 새 고객 이름을 적으세요</label>
    <input id="pkName" class="f" type="text" enterkeyhint="done" autocomplete="off" placeholder="이름이나 전화번호 일부">
    <div id="pkList" class="pk-list" role="listbox" aria-label="기존 고객"></div>
    <div class="pk-new">
      <label class="pk-lab" for="pkPhone">새 고객이면 연락처도 적어 주세요 (선택)</label>
      <input id="pkPhone" class="f num" type="text" inputmode="tel" autocomplete="off" placeholder="010-0000-0000">
    </div>
    <div class="dlg-btns">
      <button id="pkCancel" class="mini-btn" type="button">취소</button>
      <button id="pkOk" class="btn" type="button" disabled>새 고객으로 추가</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var mainEl = $('#main'), listEl = $('#list'), stateEl = $('#state'), calEl = $('#cal'), summaryEl = $('#summary'), saveEl = $('#save'), qEl = $('#q');
  var vAll = $('#vAll'), vDate = $('#vDate'), badgeEl = $('#badge'), bkInfoEl = $('#bkInfo'), fileEl = $('#file'), addBtn = $('#add');
  var headsTop = $('#headsTop'), heads2El = $('#heads2');
  var detailEl = $('#detail'), dtCard = $('#dtCard'), dtList = $('#dtList'), dtCount = $('#dtCount'), dtEmpty = $('#dtEmpty'), dtDel = $('#dtDel');
  var STATUS = { none: '미통화', done: '통화완료', miss: '부재중' };
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  var KEY = 'crm_customers_v1', KEY_BK = 'crm_last_backup', KEY_VIEW = 'crm_view', KEY_RP = 'crm_report_seen';
  var bannerEl = $('#banner'), bnText = $('#bnText'), reportEl = $('#report'), rpBody = $('#rpBody');
  var reportDate = null;

  /* 저장 구조 (KEY 하나에 id → 기록):
     고객  { kind:'c', name, phone, memo, createdAt, updatedAt }
     상담  { kind:'v', cid(고객 id), date, status, calledAt, note, createdAt, updatedAt }
     예전 형식(kind 없음: 고객 한 명 = 다음 연락 하나)은 불러올 때 자동으로 고객 + 상담 하나로 바꾼다. */

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function ymd(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function today() { return ymd(new Date()); }
  function tomorrow() { var d = new Date(); d.setDate(d.getDate() + 1); return ymd(d); }
  function md(s) {
    var p = (s || '').split('-');
    return p.length === 3 ? (+p[1]) + '/' + (+p[2]) : '';
  }
  function dlabel(k) {
    var p = k.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return (+p[1]) + '월 ' + (+p[2]) + '일 (' + WD[d.getDay()] + ')';
  }
  function shiftMonth(key, delta) {
    var p = key.split('-');
    return ymd(new Date(+p[0], +p[1] - 1 + delta, 1)).slice(0, 7);
  }
  function autosize(ta) {
    ta.style.height = 'auto';
    ta.style.height = Math.max(ta.scrollHeight + 2, 34) + 'px';
  }
  function normC(d) { return Object.assign({ name: '', phone: '', memo: '', createdAt: 0 }, d || {}); }
  function normV(d) { return Object.assign({ cid: '', date: '', status: 'none', calledAt: '', note: '', createdAt: 0 }, d || {}); }
  function isV(d) { return !!d && d.kind === 'v'; }
  function byName(a, b) { return (a.name || '￿').localeCompare(b.name || '￿', 'ko'); }
  function newId(p) { return (p || 'c') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function digitsOf(s) { return String(s || '').replace(/\D/g, ''); }

  var storageOk = true;
  try { localStorage.setItem('crm_probe', '1'); localStorage.removeItem('crm_probe'); } catch (e) { storageOk = false; }

  var customers = new Map();   // 모든 기록 (고객 + 상담)
  var rowsMain = new Map(), rowsDt = new Map(), heads = new Map();
  var query = '';
  var view = lsGet(KEY_VIEW) === 'date' ? 'date' : 'all';
  var detailId = null;
  var sel = today();
  var monthKey = sel.slice(0, 7);
  var calSig = '';
  var pendingFocus = null;
  var saveTimer = null, persistTimer = null, persistAsked = false;

  /* ---------- storage ---------- */
  function migrate(m) {
    var changed = false, now = Date.now();
    m.forEach(function (d, id) {
      if (d.kind === 'c' || d.kind === 'v') return;
      var created = Number(d.createdAt) || now;
      var hasOld = d.nextDate || d.note || d.calledAt || (d.status && d.status !== 'none');
      m.set(id, { kind: 'c', name: String(d.name || ''), phone: String(d.phone || ''), memo: '', createdAt: created, updatedAt: now });
      if (hasOld) {
        m.set('v_' + id, {
          kind: 'v', cid: id, date: d.nextDate || d.calledAt || ymd(new Date(created)),
          status: STATUS[d.status] ? d.status : 'none', calledAt: d.calledAt || '', note: String(d.note || ''),
          createdAt: created, updatedAt: now
        });
      }
      changed = true;
    });
    return changed;
  }
  function toObj(m) { var o = {}; m.forEach(function (d, id) { o[id] = d; }); return o; }
  function loadAll() {
    var m = new Map();
    try {
      var raw = localStorage.getItem(KEY);
      var o = raw ? JSON.parse(raw) : {};
      Object.keys(o).forEach(function (id) { if (o[id] && typeof o[id] === 'object') m.set(id, o[id]); });
    } catch (e) { /* empty */ }
    if (migrate(m)) lsSet(KEY, JSON.stringify(toObj(m)));
    return m;
  }
  function setSave(text, err, ms) {
    saveEl.textContent = text;
    saveEl.className = 'save' + (err ? ' err' : '');
    clearTimeout(saveTimer);
    if (!err && text) saveTimer = setTimeout(function () { saveEl.textContent = storageOk ? '' : warnNoStorage; }, ms || 2500);
  }
  var warnNoStorage = '';
  function persist() {
    clearTimeout(persistTimer);
    persistTimer = null;
    if (lsSet(KEY, JSON.stringify(toObj(customers)))) {
      setSave('저장됨');
      if (!persistAsked && navigator.storage && navigator.storage.persist) {
        persistAsked = true;
        try { navigator.storage.persist(); } catch (e) { /* ignore */ }
      }
    } else {
      setSave('저장하지 못했습니다. 브라우저 저장 공간을 확인해 주세요.', true);
    }
  }
  function queuePersist(now) {
    clearTimeout(persistTimer);
    setSave('저장 중…');
    persistTimer = setTimeout(persist, now ? 0 : 400);
  }
  function flushAll() { if (persistTimer) persist(); }
  function save(id, patch, now) {
    var cur = customers.get(id);
    if (!cur) return;
    customers.set(id, Object.assign({}, cur, patch, { updatedAt: Date.now() }));
    queuePersist(now);
  }

  /* 고객 목록 + 고객별 상담 묶음 */
  function index() {
    var cs = new Map(), vsBy = new Map(), vis = [];
    customers.forEach(function (d, id) {
      if (isV(d)) { var v = normV(d); v.id = id; vis.push(v); }
      else {
        var c = normC(d); c.id = id;
        c.name = String(c.name || ''); c.phone = String(c.phone || ''); c.memo = String(c.memo || '');
        cs.set(id, c); vsBy.set(id, []);
      }
    });
    vis = vis.filter(function (v) {
      var c = cs.get(v.cid);
      if (!c) return false;      // 고객이 아직 동기화되지 않았거나 지워진 상담은 숨긴다
      v.c = c; v.name = c.name; v.note = String(v.note || '');
      vsBy.get(v.cid).push(v);
      return true;
    });
    return { cs: cs, vsBy: vsBy, vis: vis };
  }
  function summaryOf(vs) {
    var next = null, last = null;
    vs.forEach(function (v) {
      if (v.status !== 'done' && v.date && (!next || v.date < next.date)) next = v;
      if (v.status !== 'none') { var k = v.calledAt || v.date; if (!last || k > last.k) last = { v: v, k: k }; }
    });
    return { next: next, last: last };
  }

  /* ---------- rows ---------- */
  function tpl(html) { var t = document.createElement('template'); t.innerHTML = html; return t; }
  var CALL = '<div class="c call"><span class="cap">통화</span><span class="pill"><select data-f="status" aria-label="통화 여부"><option value="none">미통화</option><option value="done">통화완료</option><option value="miss">부재중</option></select></span><span class="called"></span></div>';
  var CTPL = tpl(
    '<article class="row crow">' +
    '<div class="c name"><span class="cap">이름</span><input class="f nm" data-f="name" placeholder="이름" autocomplete="off" aria-label="이름"></div>' +
    '<div class="c phone"><span class="cap">연락처</span><div class="phone-in"><input class="f num" data-f="phone" type="text" inputmode="tel" placeholder="010-0000-0000" autocomplete="off" aria-label="연락처"><a class="tel" href="#" hidden>전화</a></div></div>' +
    '<div class="c memo"><span class="cap">메모</span><textarea class="f" data-f="memo" rows="1" placeholder="주소, 특이사항 등" aria-label="고객 메모"></textarea></div>' +
    '<div class="c sum"><span class="cap">상담</span><button class="sum-btn" type="button"><span class="sum-1"></span><span class="sum-2"></span><span class="sum-3"></span></button></div>' +
    '<div class="c act"><button class="del" type="button" aria-label="고객 삭제">삭제</button></div>' +
    '</article>');
  var VTPL = tpl(
    '<article class="row vrow">' +
    '<div class="c name"><span class="cap">이름</span><button class="who" type="button" title="고객 정보 보기"><span class="who-n"></span><span class="who-a" aria-hidden="true">›</span></button></div>' +
    '<div class="c phone"><span class="cap">연락처</span><div class="phone-in"><span class="ph num"></span><a class="tel" href="#" hidden>전화</a></div></div>' +
    CALL +
    '<div class="c note"><span class="cap">상담내용</span><textarea class="f" data-f="note" rows="2" placeholder="상담 내용을 적어두세요" aria-label="상담내용"></textarea></div>' +
    '<div class="c next"><span class="cap">상담일</span><input class="f" data-f="date" type="date" aria-label="상담일"></div>' +
    '<div class="c act"><button class="del" type="button" aria-label="상담 삭제">삭제</button></div>' +
    '</article>');

  function makeRow(t, id, pfx) {
    var r = t.content.firstElementChild.cloneNode(true);
    r.dataset.id = id;
    r.querySelectorAll('[data-f]').forEach(function (f) { f.id = pfx + '-' + f.dataset.f + '-' + id; });
    return r;
  }
  function fillFields(r, rec) {
    var active = document.activeElement;
    r.querySelectorAll('[data-f]').forEach(function (f) {
      if (f === active) return;
      var v = rec[f.dataset.f] == null ? '' : String(rec[f.dataset.f]);
      if (f.value !== v) { f.value = v; if (f.tagName === 'TEXTAREA') autosize(f); }
    });
  }
  function setTel(r, phone) {
    var tel = r.querySelector('.tel');
    var num = String(phone || '').replace(/[^\d+]/g, '');
    tel.hidden = !num;
    if (num) tel.href = 'tel:' + num;
  }
  function fillC(r, c, vs, t) {
    fillFields(r, c);
    setTel(r, c.phone);
    var s = summaryOf(vs);
    var l1 = r.querySelector('.sum-1'), l2 = r.querySelector('.sum-2'), l3 = r.querySelector('.sum-3');
    if (s.next) {
      var d = s.next.date;
      l1.textContent = d < t ? '기한 지남 ' + md(d) : d === t ? '오늘 연락' : '다음 연락 ' + md(d);
      l1.className = 'sum-1' + (d < t ? ' late' : d === t ? ' today' : '');
    } else { l1.textContent = '예정된 연락 없음'; l1.className = 'sum-1 none'; }
    l2.textContent = s.last ? '최근 ' + md(s.last.k) + ' ' + STATUS[s.last.v.status] : '';
    l2.hidden = !s.last;
    l3.textContent = vs.length ? '상담 ' + vs.length + '건 보기 ›' : '고객 정보 보기 ›';
  }
  function fillV(r, v, inDt) {
    r.dataset.status = STATUS[v.status] ? v.status : 'none';
    r.dataset.cid = v.cid;
    r.classList.toggle('dim', !inDt && view === 'date' && v.status === 'done');
    fillFields(r, v);
    r.querySelector('.called').textContent = v.calledAt && v.status !== 'none' ? md(v.calledAt) + ' 통화' : '';
    r.querySelector('.who-n').textContent = v.c.name || '(이름 없음)';
    r.querySelector('.ph').textContent = v.c.phone;
    setTel(r, v.c.phone);
  }
  function headFor(key, text, count, cls) {
    var h = heads.get(key);
    if (!h) {
      h = el('h2', 'grp');
      h.append(el('span', 'gd'), el('span', 'gc'));
      heads.set(key, h);
    }
    h.className = 'grp' + (cls ? ' ' + cls : '');
    h.firstChild.textContent = text;
    h.lastChild.textContent = count + '명';
    return h;
  }
  function relOf(k, open, t, tm) {
    if (k < t) return { rel: open ? '기한 지남' : '지난 연락', cls: open ? 'late' : '' };
    if (k === t) return { rel: '오늘', cls: 'today' };
    if (k === tm) return { rel: '내일', cls: '' };
    return { rel: '', cls: '' };
  }
  /* 줄 순서 맞추기: 입력 중인 줄은 건드리지 않는다 */
  function placeRows(container, map, order) {
    var keep = new Set(order);
    Array.prototype.slice.call(container.children).forEach(function (n) { if (!keep.has(n)) n.remove(); });
    map.forEach(function (r, id) { if (!keep.has(r)) map.delete(id); });
    var activeRow = document.activeElement && document.activeElement.closest ? document.activeElement.closest('.row') : null;
    var prev = null;
    order.forEach(function (n) {
      if (n !== activeRow) {
        var want = prev ? prev.nextSibling : container.firstChild;
        if (n !== want) container.insertBefore(n, want);
      }
      prev = n;
    });
  }

  /* ---------- calendar ---------- */
  function renderCal(byDay, t, lateN) {
    var days = {};
    Object.keys(byDay).forEach(function (k) {
      days[k] = byDay[k].slice().sort(byName).map(function (c) { return [c.name, c.status]; });
    });
    var sig = JSON.stringify([monthKey, sel, t, lateN, days]);
    if (sig === calSig) return;
    calSig = sig;
    var ad = document.activeElement;
    var keepKey = ad && calEl.contains(ad) ? ad.getAttribute('data-fk') : null;
    calEl.replaceChildren();

    var bar = el('div', 'cal-bar');
    var prev = el('button', 'nav', '‹'); prev.type = 'button'; prev.setAttribute('aria-label', '이전 달'); prev.setAttribute('data-fk', 'prev');
    prev.onclick = function () { monthKey = shiftMonth(monthKey, -1); render(); };
    var next = el('button', 'nav', '›'); next.type = 'button'; next.setAttribute('aria-label', '다음 달'); next.setAttribute('data-fk', 'next');
    next.onclick = function () { monthKey = shiftMonth(monthKey, 1); render(); };
    var mp = monthKey.split('-');
    var title = el('span', 'cal-title', mp[0] + '년 ' + (+mp[1]) + '월');
    var todayBtn = el('button', 'mini-btn', '오늘'); todayBtn.type = 'button'; todayBtn.setAttribute('data-fk', 'today');
    todayBtn.onclick = function () { sel = t; monthKey = t.slice(0, 7); render(); };
    bar.append(prev, title, next, todayBtn);
    if (sel !== 'late' && days[sel]) {
      var rb = el('button', 'mini-btn', '이 날 리포트'); rb.type = 'button'; rb.setAttribute('data-fk', 'report');
      rb.onclick = function () { openReport(sel); };
      bar.append(rb);
    }
    if (lateN) {
      var lb = el('button', 'mini-btn late-btn', '기한 지남 ' + lateN + '명'); lb.type = 'button'; lb.setAttribute('data-fk', 'late');
      lb.setAttribute('aria-pressed', String(sel === 'late'));
      lb.onclick = function () { sel = sel === 'late' ? t : 'late'; render(); };
      bar.append(lb);
    }

    var grid = el('div', 'grid');
    WD.forEach(function (w) { grid.append(el('div', 'wd', w)); });
    var first = new Date(+mp[0], +mp[1] - 1, 1);
    var offset = first.getDay();
    var total = Math.ceil((offset + new Date(+mp[0], +mp[1], 0).getDate()) / 7) * 7;
    for (var i = 0; i < total; i++) {
      var d = new Date(+mp[0], +mp[1] - 1, 1 - offset + i);
      var k = ymd(d);
      var list = days[k] || [];
      var open = list.some(function (x) { return x[1] !== 'done'; });
      var b = el('button', 'day');
      b.type = 'button';
      b.setAttribute('data-fk', 'd:' + k);
      b.setAttribute('aria-label', dlabel(k) + (list.length ? ', ' + list.length + '명' : ', 연락 없음'));
      b.setAttribute('aria-pressed', String(sel === k));
      if (k.slice(0, 7) !== monthKey) b.classList.add('out');
      if (d.getDay() === 0) b.classList.add('sun');
      if (k === t) b.classList.add('today');
      if (k === sel) b.classList.add('sel');
      if (k < t && open) b.classList.add('late');
      b.append(el('span', 'dn', String(d.getDate())));
      if (list.length) {
        var cnt = el('span', 'cnt', String(list.length));
        if (!open) cnt.classList.add('alldone');
        else if (k < t) cnt.classList.add('late');
        else if (k === t) cnt.classList.add('today');
        b.append(cnt);
        var names = el('span', 'names');
        list.slice(0, 3).forEach(function (x) {
          names.append(el('span', 'pn s-' + (STATUS[x[1]] ? x[1] : 'none'), x[0] || '(이름 없음)'));
        });
        if (list.length > 3) names.append(el('span', 'more', '+' + (list.length - 3) + '명'));
        b.append(names);
      }
      (function (key) {
        b.onclick = function () { sel = key; monthKey = key.slice(0, 7); render(); };
      })(k);
      grid.append(b);
    }
    calEl.append(bar, grid);
    if (keepKey) {
      var again = calEl.querySelector('[data-fk="' + keepKey + '"]');
      if (again) again.focus();
    }
  }

  /* ---------- state + render ---------- */

      b = el('button', 'btn', '+ 상담 추가'); b.type = 'button'; b.onclick = onAdd;

    if (b) stateEl.append(b);

  function updateBackupInfo(n) {
    var last = lsGet(KEY_BK);
    var warn = false, text = '';
    if (n) {
      if (!last) { text = '아직 백업하지 않았습니다'; warn = true; }
      else {
        var days = Math.floor((new Date(today() + 'T00:00:00') - new Date(last + 'T00:00:00')) / 86400000);
        text = '마지막 백업 ' + md(last);
        if (days >= 14) { text += ' (' + days + '일 전)'; warn = true; }
      }
    }
    bkInfoEl.textContent = text;
    bkInfoEl.className = 'bk-info' + (warn ? ' warn' : '');
  }

  function matches(q, digits, c, vs) {
    if (!q) return true;
    var hay = (c.name + '\n' + c.phone + '\n' + c.memo + '\n' + vs.map(function (v) { return v.note; }).join('\n')).toLowerCase();
    return hay.indexOf(q) >= 0 || (digits.length >= 3 && digitsOf(c.phone).indexOf(digits) >= 0);
  }

  function render() {
    if (detailId && !(customers.has(detailId) && !isV(customers.get(detailId)))) detailId = null;
    var inRp = !!reportDate;
    var inDt = !!detailId && !inRp;
    vAll.setAttribute('aria-pressed', String(view === 'all'));
    vDate.setAttribute('aria-pressed', String(view === 'date'));
    document.body.classList.toggle('v-date', view === 'date' && !inDt && !inRp);
    document.body.classList.toggle('v-detail', inDt);
    addBtn.textContent = view === 'date' ? '+ 상담 추가' : '+ 고객 추가';
    addBtn.hidden = inDt || inRp;
    qEl.hidden = inDt || inRp;
    var t = today(), tm = tomorrow();
    var q = query.trim().toLowerCase();
    var digits = q.replace(/\D/g, '');
    var ix = index();
    var nToday = 0, nLate = 0, nNoDate = 0;
    ix.vis.forEach(function (v) {
      if (v.status === 'done') return;

      else if (v.date < t) nLate++;

    });
    badgeEl.hidden = !(nToday + nLate);

    summaryEl.textContent = view === 'all' || inDt
      ? '고객 ' + ix.cs.size + '명 · 상담 ' + ix.vis.length + '건'
      : '오늘 연락 ' + nToday + '명 · 기한 지남 ' + nLate + '명' + (nNoDate ? ' · 날짜 미정 ' + nNoDate + '건' : '');
    updateBackupInfo(ix.cs.size);

    headsTop.hidden = inDt || inRp || view !== 'all';
    heads2El.hidden = inDt || inRp || view !== 'date';
    detailEl.hidden = !inDt;
    reportEl.hidden = !inRp;
    listEl.hidden = inDt || inRp;
    renderBanner(ix, t, inDt || inRp);
    if (inRp) {
      calEl.hidden = true;
      stateEl.hidden = true;

    if (inDt) {

    var order = [], fresh = [], shown = 0;

    if (view === 'all') {

      cl.sort(function (a, b) { return b.createdAt - a.createdAt; });
      cl.forEach(function (c) { fillC(rowOf(c.id, CTPL), c, ix.vsBy.get(c.id), t); });
    } else {
      var byDay = {};
      ix.vis.forEach(function (v) {
        if (v.date && (!q || matches(q, digits, v.c, [v]))) (byDay[v.date] = byDay[v.date] || []).push(v);
      });
      var lateN = 0;
      Object.keys(byDay).forEach(function (k) {
        if (k < t) byDay[k].forEach(function (v) { if (v.status !== 'done') lateN++; });
      });
      if (sel === 'late' && !lateN) sel = t;
      calEl.hidden = false;
      renderCal(byDay, t, lateN);
      var putV = function (v) { fillV(rowOf(v.id, VTPL), v, false); };
      if (sel === 'late') {
        Object.keys(byDay).filter(function (k) { return k < t; }).sort().forEach(function (k) {
          var g = byDay[k].filter(function (v) { return v.status !== 'done'; }).sort(byName);
          if (!g.length) return;
          order.push(headFor(k, '기한 지남 · ' + dlabel(k), g.length, 'late'));
          g.forEach(putV);
        });
      } else {
        var g2 = (byDay[sel] || []).slice().sort(byName);
        if (g2.length) {
          var open = g2.some(function (v) { return v.status !== 'done'; });
          var rr = relOf(sel, open, t, tm);
          order.push(headFor(sel, (rr.rel ? rr.rel + ' · ' : '') + dlabel(sel), g2.length, rr.cls));
          g2.forEach(putV);
        }
      }
    }

    placeRows(listEl, rowsMain, order);
    var keepSet = new Set(order);
    heads.forEach(function (h, k) { if (!keepSet.has(h)) heads.delete(k); });
    fresh.forEach(function (r) { r.querySelectorAll('textarea').forEach(autosize); });

    if (view === 'all' && !ix.cs.size) showState('empty');
    else if (!shown) showState(view === 'date' && !q ? 'dayempty' : 'nomatch');
    else showState(null);
    focusPending();
  }

  function renderDetail(ix) {
    var c = ix.cs.get(detailId);
    dtCard.dataset.id = c.id;
    fillFields(dtCard, c);
    setTel(dtCard, c.phone);
    autosize($('#dtMemo'));
    var vs = ix.vsBy.get(c.id).slice().sort(function (a, b) {

    });

    vs.forEach(function (v) {

      fillV(r, v, true);
      order.push(r);
    });

  }

  /* ---------- 일자별 리포트 ---------- */
  function shortDay(k) {
    var p = k.split('-');
    return md(k) + ' (' + WD[new Date(+p[0], +p[1] - 1, +p[2]).getDay()] + ')';
  }
  /* 리포트를 알려줄 날짜: 오늘 일정이 모두 끝났으면(미통화 없음) 오늘, 아니면 최근 7일 안의 지난 상담일. 이미 본(닫은) 날짜는 빼고 */
  function reportCandidate(ix, t) {
    var seen = lsGet(KEY_RP) || '';
    var byD = {};
    ix.vis.forEach(function (v) { if (v.date) (byD[v.date] = byD[v.date] || []).push(v); });
    var tv = byD[t];
    if (tv && seen < t && tv.every(function (v) { return v.status !== 'none'; })) return { date: t, today: true };
    var lim = ymd(new Date(Date.now() - 7 * 864e5));
    var past = Object.keys(byD).filter(function (k) { return k < t && k >= lim && k > seen; }).sort();
    return past.length ? { date: past[past.length - 1], today: false } : null;
  }
  function renderBanner(ix, t, off) {
    var c = off ? null : reportCandidate(ix, t);
    bannerEl.hidden = !c;
    if (!c) return;
    bannerEl.dataset.date = c.date;
    bnText.textContent = c.today ? '오늘 상담 일정을 모두 마쳤습니다. 오늘 리포트를 확인하세요.' : dlabel(c.date) + ' 상담 리포트가 준비됐습니다.';
  }
  function markSeen(date) { if ((lsGet(KEY_RP) || '') < date) lsSet(KEY_RP, date); }
  function openReport(date) {
    flushAll();
    markSeen(date);
    reportDate = date;
    render();
    window.scrollTo(0, 0);
  }
  function closeReport() {
    reportDate = null;
    render();
    window.scrollTo(0, 0);
  }
  function renderReport(ix) {
    var D = reportDate;
    var vs = ix.vis.filter(function (v) { return v.date === D; }).sort(byName);
    var n = { done: 0, miss: 0, none: 0 };
    vs.forEach(function (v) { n[STATUS[v.status] ? v.status : 'none']++; });
    var nextOf = function (cid) {
      var best = null;
      ix.vsBy.get(cid).forEach(function (v) { if (v.date > D && (!best || v.date < best.date)) best = v; });
      return best;
    };
    var frag = document.createDocumentFragment();
    frag.append(el('h2', null, dlabel(D) + ' 상담 리포트'));
    var now = new Date();
    frag.append(el('p', 'rp-made', '만든 시각 ' + ymd(now) + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0')));

    var stats = el('div', 'rp-stats');
    [['예정', vs.length, ''], ['통화완료', n.done, 'done'], ['부재중', n.miss, 'miss'], ['미통화', n.none, 'none']].forEach(function (s) {
      var b = el('div', 'rp-st ' + s[2]);
      b.append(el('b', null, s[1] + '건'), el('span', null, s[0]));
      stats.append(b);
    });
    frag.append(stats);

    var h = el('h3', null, '고객별 상담내용'); h.append(el('span', 'gc', vs.length + '명')); frag.append(h);
    if (!vs.length) frag.append(el('p', 'rp-note', '이 날은 상담 일정이 없습니다.'));
    else {
      var tb = el('table', 'rp-t'), thead = el('thead'), hr = el('tr');
      ['이름', '연락처', '결과', '상담내용', '다음 일정'].forEach(function (x) { hr.append(el('th', null, x)); });
      thead.append(hr); tb.append(thead);
      var body = el('tbody');
      vs.forEach(function (v) {
        var tr = el('tr'), st = STATUS[v.status] ? v.status : 'none';
        var td = function (cls, cap, text) { var c = el('td', cls, text); if (cap) c.setAttribute('data-cap', cap); tr.append(c); return c; };
        td('nm2', '', v.c.name || '(이름 없음)');

        var r = td('', '결과');

        td('nx', '다음 일정', nx ? shortDay(nx.date) : '없음');
        body.append(tr);
      });
      tb.append(body);
      frag.append(tb);
    }

    var todo = vs.filter(function (v) { return v.status !== 'done'; });
    h = el('h3', null, '남은 할 일 (다시 연락할 고객)'); h.append(el('span', 'gc', todo.length + '명')); frag.append(h);
    if (!todo.length) frag.append(el('p', 'rp-note', vs.length ? '모두 통화를 마쳤습니다.' : '없음'));
    else {
      var ul = el('ul', 'rp-ul');
      todo.forEach(function (v) {
        var li = el('li');
        var nx = nextOf(v.cid);
        li.append(el('b', null, v.c.name || '(이름 없음)'), document.createTextNode(' '), el('span', 'num', v.c.phone || ''), document.createTextNode(' · ' + STATUS[v.status] + (nx ? ' · 다음 일정 ' + shortDay(nx.date) : ' · 다음 일정 없음')));
        ul.append(li);
      });
      frag.append(ul);
    }

    var seenC = {}, nexts = [], none = [];
    vs.forEach(function (v) {
      if (seenC[v.cid]) return;
      seenC[v.cid] = 1;
      var nx = nextOf(v.cid);
      if (nx) nexts.push({ d: nx.date, c: v.c }); else none.push(v.c.name || '(이름 없음)');
    });
    nexts.sort(function (a, b) { return a.d.localeCompare(b.d) || byName(a.c, b.c); });
    h = el('h3', null, '다음 일정'); frag.append(h);

      var ul2 = el('ul', 'rp-ul');
      nexts.forEach(function (x) { var li = el('li'); li.append(el('b', null, shortDay(x.d)), document.createTextNode(' ' + (x.c.name || '(이름 없음)'))); ul2.append(li); });
      frag.append(ul2);
    }
    if (none.length) frag.append(el('p', 'rp-note', '다음 일정이 없는 고객: ' + none.join(', ')));
    if (!nexts.length && !none.length) frag.append(el('p', 'rp-note', '없음'));
    rpBody.replaceChildren(frag);
  }

    render();
    window.scrollTo(0, 0);
  }

  /* ---------- actions ---------- */
  function onAdd() { if (view === 'date') openPicker(); else addCustomer(); }
  function addCustomer() {
    query = ''; qEl.value = '';
    var id = newId('c'), now = Date.now();
    customers.set(id, { kind: 'c', name: '', phone: '', memo: '', createdAt: now, updatedAt: now });

  /* ---------- 상담 추가 창 (날짜별 연락에서 + 상담 추가) ---------- */
  var pk = { el: $('#pick'), name: $('#pkName'), phone: $('#pkPhone'), list: $('#pkList'), ok: $('#pkOk'), title: $('#pkTitle'), date: '', items: [], hi: -1, back: null };
  function openPicker() {
    if (sel === 'late') { sel = today(); monthKey = sel.slice(0, 7); render(); }
    pk.date = sel;
    pk.back = document.activeElement;
    pk.title.textContent = dlabel(pk.date) + ' 상담 추가';
    pk.name.value = ''; pk.phone.value = '';
    pk.el.hidden = false;
    renderPick();
    pk.name.focus();
  }
  function closePicker() {
    if (pk.el.hidden) return;
    pk.el.hidden = true;
    if (pk.back && pk.back.isConnected) try { pk.back.focus(); } catch (e) { /* ignore */ }
  }
  function renderPick() {
    var q = pk.name.value.trim().toLowerCase(), digits = q.replace(/\D/g, '');
    var ix = index(), list = [], exact = false;
    ix.cs.forEach(function (c) {
      var nm = c.name.toLowerCase();
      if (q && nm === q) exact = true;
      if (!q || nm.indexOf(q) >= 0 || (digits.length >= 3 && digitsOf(c.phone).indexOf(digits) >= 0)) list.push(c);
    });
    list.sort(function (a, b) {
      var ap = q && a.name.toLowerCase().indexOf(q) === 0 ? 0 : 1, bp = q && b.name.toLowerCase().indexOf(q) === 0 ? 0 : 1;
      return ap - bp || byName(a, b);
    });
    pk.items = list.slice(0, 50);
    if (pk.hi >= pk.items.length) pk.hi = -1;
    pk.list.replaceChildren();
    pk.items.forEach(function (c, i) {
      var b = el('button', 'pk-it' + (i === pk.hi ? ' hi' : ''));
      b.type = 'button';
      b.setAttribute('role', 'option');
      b.dataset.id = c.id;
      b.append(el('b', null, c.name || '(이름 없음)'), el('span', 'num', c.phone));
      var s = summaryOf(ix.vsBy.get(c.id));
      var sub = c.memo ? c.memo.split('\n')[0] : s.last ? '최근 ' + md(s.last.k) + ' ' + STATUS[s.last.v.status] : '';
      if (sub) b.append(el('span', 'pk-m', sub));
      pk.list.append(b);
    });
    if (!pk.items.length) {
      pk.list.append(el('div', 'pk-hint', q ? '일치하는 기존 고객이 없습니다. 아래에 연락처를 적고 "새 고객으로 추가"를 누르세요.' : '아직 등록된 고객이 없습니다. 새 고객 이름을 적어 주세요.'));
    } else if (list.length > pk.items.length) {
      pk.list.append(el('div', 'pk-hint', '그 밖에 ' + (list.length - pk.items.length) + '명 더 있습니다. 이름을 더 적어 좁혀 보세요.'));
    }
    pk.ok.disabled = !q;
    pk.ok.textContent = exact ? '같은 이름의 새 고객으로 추가' : '새 고객으로 추가';
  }
  function pickExisting(cid) {
    var date = pk.date, found = null;
    customers.forEach(function (d, id) { if (!found && isV(d) && d.cid === cid && d.date === date) found = id; });
    var vid = found || addVisit(cid, date);
    pk.back = null;
    closePicker();
    query = ''; qEl.value = '';
    sel = date; monthKey = date.slice(0, 7);
    pendingFocus = { id: vid, sel: '[data-f="note"]' };
    render();
    if (found) setSave('이 날에 이미 있는 상담을 열었습니다.');
  }
  function pickNew() {
    var name = pk.name.value.trim();
    if (!name) return;
    var id = newId('c'), now = Date.now();
    customers.set(id, { kind: 'c', name: name, phone: pk.phone.value.trim(), memo: '', createdAt: now, updatedAt: now });
    pickExisting(id);
  }
  pk.name.addEventListener('input', function () { pk.hi = -1; renderPick(); });
  pk.name.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!pk.items.length) return;
      e.preventDefault();
      pk.hi = e.key === 'ArrowDown' ? Math.min(pk.hi + 1, pk.items.length - 1) : Math.max(pk.hi - 1, -1);
      renderPick();
      var h = pk.list.querySelector('.hi');
      if (h) h.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (pk.hi >= 0 && pk.items[pk.hi]) pickExisting(pk.items[pk.hi].id);
      else if (pk.items.length === 1 && pk.items[0].name.toLowerCase() === pk.name.value.trim().toLowerCase()) pickExisting(pk.items[0].id);
      else pk.phone.focus();
    }
  });
  pk.phone.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); pickNew(); } });
  pk.list.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.pk-it');
    if (b) pickExisting(b.dataset.id);
  });
  pk.ok.addEventListener('click', pickNew);
  $('#pkCancel').addEventListener('click', closePicker);
  pk.el.addEventListener('click', function (e) { if (e.target === pk.el) closePicker(); });
  pk.el.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.preventDefault(); closePicker(); } });

  /* ---------- backup / export ---------- */
  /* 앱(안드로이드/윈도우)에서는 app-bridge.js의 AppFiles.save로 실제 파일을 저장하고, 저장 위치를 done(위치)로 알려준다.
     일반 브라우저에서는 예전처럼 다운로드한다. done(null) = 위치를 알 수 없음, 취소하면 done을 부르지 않는다. */
  function download(name, text, type, done) {
    if (window.AppFiles) {
      setSave('저장 중…');
      window.AppFiles.save(name, text, type).then(function (where) {
        if (where) done(where); else setSave('');
      }, function (e) {
        setSave('파일을 저장하지 못했습니다. ' + (e && e.message ? e.message : ''), true);
      });
      return;
    }
    done(null);
    var blob = new Blob([text], { type: type });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.append(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function exportBackup() {
    flushAll();
    var payload = { app: 'customer-notes', version: 2, exportedAt: new Date().toISOString(), customers: toObj(customers) };
    download('customer-notes-backup-' + today() + '.json', JSON.stringify(payload, null, 1), 'application/json', function (where) {
      lsSet(KEY_BK, today());
      updateBackupInfo(1);
      setSave(where ? '백업 파일을 저장했습니다. 저장 위치: ' + where : '백업 파일을 저장했습니다. 다운로드 폴더를 확인하세요.', false, where ? 12000 : 0);
    });
  }
  function csvCell(v, guard) {
    var s = String(v == null ? '' : v);
    if (guard && /^[=+\-@]/.test(s)) s = "'" + s;
    return '"' + s.replace(/"/g, '""') + '"';
  }
  function exportCsv() {
    var lines = [['이름', '연락처', '고객 메모', '상담일', '통화 여부', '통화일', '상담내용'].map(function (h) { return csvCell(h); }).join(',')];
    var ix = index(), cl = [];
    ix.cs.forEach(function (c) { cl.push(c); });
    cl.sort(byName);
    cl.forEach(function (c) {
      var head = [csvCell(c.name, true), csvCell(c.phone), csvCell(c.memo, true)];
      var vs = ix.vsBy.get(c.id).slice().sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });
      if (!vs.length) { lines.push(head.concat(['""', '""', '""', '""']).join(',')); return; }
      vs.forEach(function (v) {
        lines.push(head.concat([csvCell(v.date), csvCell(STATUS[v.status] || STATUS.none), csvCell(v.calledAt), csvCell(v.note, true)]).join(','));
      });
    });
    download('customer-notes-' + today() + '.csv', '﻿' + lines.join('\r\n'), 'text/csv;charset=utf-8', function (where) {
      setSave(where ? '엑셀용 CSV 파일을 저장했습니다. 저장 위치: ' + where : '엑셀용 CSV 파일을 저장했습니다.', false, where ? 12000 : 0);
    });
  }
  function importBackup(file) {
    if (!file) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var data = JSON.parse(String(rd.result));
        var src = data && typeof data.customers === 'object' && data.customers ? data.customers : null;
        if (!src) throw new Error('bad');
        var m = new Map();
        Object.keys(src).forEach(function (id) { if (src[id] && typeof src[id] === 'object') m.set(id, src[id]); });
        migrate(m);
        var now = Date.now(), nC = 0, nV = 0;
        m.forEach(function (d, id) {
          customers.set(id, Object.assign({}, d, { updatedAt: Math.max(Number(d.updatedAt) || 0, now) }));
          if (isV(d)) nV++; else nC++;
        });
        persist();
        render();
        setSave('고객 ' + nC + '명, 상담 ' + nV + '건을 불러왔습니다.');
      } catch (e) {
        setSave('백업 파일을 읽지 못했습니다. 이 앱에서 저장한 .json 파일인지 확인해 주세요.', true);
      }
    };
    rd.onerror = function () { setSave('파일을 읽지 못했습니다.', true); };
    rd.readAsText(file);
  }

  /* ---------- events ---------- */
  function recOf(f) { return f.closest && f.closest('[data-id]'); }
  mainEl.addEventListener('input', function (e) {
    var f = e.target, r = recOf(f);
    if (!r || !f.dataset.f || f.tagName === 'SELECT') return;
    var patch = {}; patch[f.dataset.f] = f.value;
    if (f.tagName === 'TEXTAREA') autosize(f);
    if (f.dataset.f === 'phone') setTel(r, f.value);
    save(r.dataset.id, patch, f.type === 'date');
  });
  mainEl.addEventListener('change', function (e) {
    var f = e.target, r = recOf(f);
    if (!r || !f.dataset.f) return;
    if (f.dataset.f === 'status') {
      var v = f.value;
      r.dataset.status = v;
      save(r.dataset.id, { status: v, calledAt: v === 'none' ? '' : today() }, true);
      render();
    } else flushAll();
  });
  mainEl.addEventListener('focusout', function () {
    flushAll();
    setTimeout(function () { if (!mainEl.contains(document.activeElement) || calEl.contains(document.activeElement)) render(); }, 0);
  });
  function arm(b, label, text, run) {
    if (b.dataset.arm === '1') { run(); return; }
    b.dataset.arm = '1';
    b.textContent = text;
    setTimeout(function () { if (b.isConnected && b.dataset.arm === '1') { delete b.dataset.arm; b.textContent = label; } }, 3000);
  }
  mainEl.addEventListener('click', function (e) {
    var t = e.target;
    var who = t.closest && t.closest('.who');
    if (who) { openDetail(who.closest('.row').dataset.cid); return; }
    var sb = t.closest && t.closest('.sum-btn');
    if (sb) { openDetail(sb.closest('.row').dataset.id); return; }
    var b = t.closest && t.closest('.del');
    if (!b) return;
    if (b === dtDel) {
      var n = (index().vsBy.get(detailId) || []).length;
      arm(b, '이 고객 삭제', n ? '상담 ' + n + '건도 함께 삭제 · 확인' : '삭제 확인', function () { delete b.dataset.arm; deleteRecord(detailId); window.scrollTo(0, 0); });
      return;
    }
    var r = b.closest('.row');
    arm(b, '삭제', '삭제 확인', function () { deleteRecord(r.dataset.id); });
  });
  $('#dtBack').addEventListener('click', closeDetail);
  $('#rpBack').addEventListener('click', closeReport);
  $('#rpPrint').addEventListener('click', function () { window.print(); });
  $('#bnOpen').addEventListener('click', function () { openReport(bannerEl.dataset.date); });
  $('#bnClose').addEventListener('click', function () { markSeen(bannerEl.dataset.date); render(); });
  $('#dtAdd').addEventListener('click', function () {
    var vid = addVisit(detailId, today());
    pendingFocus = { id: vid, sel: '[data-f="note"]', dt: true };
    render();
  });
  qEl.addEventListener('input', function () { query = qEl.value; render(); });
  vAll.addEventListener('click', function () { setView('all'); });
  vDate.addEventListener('click', function () { setView('date'); });
  addBtn.addEventListener('click', onAdd);
  $('#bkExport').addEventListener('click', exportBackup);
  $('#csv').addEventListener('click', exportCsv);
  $('#bkImport').addEventListener('click', function () { fileEl.value = ''; fileEl.click(); });
  fileEl.addEventListener('change', function () { importBackup(fileEl.files && fileEl.files[0]); });
  window.addEventListener('pagehide', flushAll);
  document.addEventListener('visibilitychange', function () { if (document.hidden) flushAll(); });
  window.addEventListener('storage', function (e) {
    if (e.key === KEY) { customers = loadAll(); render(); if (!pk.el.hidden) renderPick(); }
  });
  var rz = null;
  window.addEventListener('resize', function () {
    clearTimeout(rz);
    rz = setTimeout(function () { mainEl.querySelectorAll('textarea').forEach(autosize); }, 150);
  });

  /* ---------- start ---------- */
  if (!storageOk) {
    warnNoStorage = '이 브라우저는 저장이 막혀 있어 창을 닫으면 내용이 사라집니다. 일반(비공개 아님) 창에서 열어 주세요.';
    saveEl.textContent = warnNoStorage;
    saveEl.className = 'save err';
  }
  customers = loadAll();
  render();

  /* 앱 포장(app-bridge.js)·동기화(sync.js)가 쓰는 연결 고리 */
  window.CRMApp = {
    flush: flushAll,
    view: function () { return reportDate ? 'report' : detailId ? 'detail' : view; },
    showAll: function () { setView('all'); },
    /* 뒤로가기: 처리했으면 true */
    back: function () {
      if (!pk.el.hidden) { closePicker(); return true; }
      if (reportDate) { closeReport(); return true; }
      if (detailId) { closeDetail(); return true; }
      if (view === 'date') { setView('all'); return true; }
      return false;
    },
    reload: function () { customers = loadAll(); render(); if (!pk.el.hidden) renderPick(); }
  };
})();
</script>
<script src="app-bridge.js"></script>
<script src="sync-config.js"></script>
<script src="sync.js"></script>
</body>
